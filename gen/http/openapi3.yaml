        ReassignOrgCommitteeSeatRequestBody:
            type: object
            properties:
                committee_uid:
                    type: string
                    description: Committee UID -- v2 uid, not related to v1 id directly
                    example: 7cad5a8d-19d0-41a4-81a6-043453daf9ee
                    format: uuid
                email:
                    type: string
                    description: Primary email address
                    example: user@example.com
                    format: email
                first_name:
                    type: string
                    description: First name
                    example: John
                    maxLength: 100
                last_name:
                    type: string
                    description: Last name
                    example: Doe
                    maxLength: 100
            example:
                committee_uid: 7cad5a8d-19d0-41a4-81a6-043453daf9ee
                email: user@example.com
                first_name: John
                last_name: Doe
            required:
                - committee_uid
                - first_name
                - last_name
                - email
        ServiceUnavailableError:
            type: object
            properties:
                message:
                    type: string
                    description: Error message
                    example: The service is unavailable.
            example:
                message: The service is unavailable.
            required:
                - message
        ShareWeeklyBriefToChatRequestBody:
            type: object
            properties:
                revision:
                    type: integer
                    description: Optimistic-concurrency token from GET /current
                    example: 7
                    format: int64
                    minimum: 1
            example:
                revision: 7
            required:
                - revision
        SubmitApplicationRequestBody:
            type: object
            properties:
                message:
                    type: string
                    description: Application message
                    example: I would like to join the TSC to contribute my expertise.
                    maxLength: 2000
                notify:
                    type: boolean
                    description: When true, send email notifications to committee writers about the new application. Defaults to false.
                    default: false
                    example: false
                organization:
                    type: object
                    properties:
                        id:
                            type: string
                            description: Organization ID
                            example: org-123456
                        name:
                            type: string
                            description: Organization name
                            example: The Linux Foundation
                            maxLength: 200
                        website:
                            type: string
                            description: Organization website URL
                            example: https://linuxfoundation.org
                            format: uri
                    description: Organization information for the committee member
                    example:
                        id: org-123456
                        name: The Linux Foundation
                        website: https://linuxfoundation.org
            example:
                message: I would like to join the TSC to contribute my expertise.
                notify: false
                organization:
                    id: org-123456
                    name: The Linux Foundation
                    website: https://linuxfoundation.org
        UpdateCommitteeBaseRequestBody:
            type: object
            properties:
                calendar:
                    type: object
                    properties:
                        public:
                            type: boolean
                            description: Whether the committee calendar is publicly visible
                            default: false
                            example: true
                    description: Settings related to the committee calendar
                    example:
                        public: true
                category:
                    type: string
                    description: The category of the committee
                    example: Technical Steering Committee
                    enum:
                        - Ambassador
                        - Board
                        - Code of Conduct
                        - Committers
                        - Expert Group
                        - Finance Committee
                        - Government Advisory Council
                        - Legal Committee
                        - Maintainers
                        - Marketing Committee/Sub Committee
                        - Marketing Mailing List
                        - Marketing Oversight Committee/Marketing Advisory Committee
                        - Newsletter
                        - Other
                        - Product Security
                        - Special Interest Group
                        - Technical Advisory Committee
                        - Technical Mailing List
                        - Technical Oversight Committee
                        - Technical Steering Committee
                        - Working Group
                chat_channel:
                    type: string
                    description: The chat channel URL or identifier for the committee
                    example: https://slack.example.org/channels/tsc
                    maxLength: 500
                deliverables:
                    type: array
                    items:
                        type: string
                        example: rr3
                        maxLength: 500
                    description: The deliverables of the committee, as a list of bullet points
                    example:
                        - Quarterly technical roadmap
                        - Annual governance review
                    maxItems: 50
                description:
                    type: string
                    description: The description of the committee
                    example: Main technical oversight committee for the project
                    maxLength: 2000
                display_name:
                    type: string
                    description: The display name of the committee
                    example: TSC Committee Calendar
                    maxLength: 100
                enable_voting:
                    type: boolean
                    description: Whether voting is enabled for this committee
                    default: false
                    example: true
                external_sources:
                    type: array
                    items:
                        $ref: '#/components/schemas/ExternalSource'
                    description: External source-labeled entities linked to this committee (e.g. OCG groups or events)
                    example:
                        - entity_type: group
                          label: CNCF Meetup - San Francisco
                          provider: ocg
                          url: https://community.cncf.io/cncf-meetup-san-francisco/
                    maxItems: 50
                join_mode:
                    type: string
                    description: How new members can join this committee
                    default: invite_only
                    example: open
                    enum:
                        - open
                        - invite_only
                        - application
                        - closed
                key_dates:
                    type: array
                    items:
                        $ref: '#/components/schemas/KeyDate'
                    description: Timeline of important dates for the committee
                    example:
                        - date: 2026-04
                          label: Charter renewal
                    maxItems: 50
                mailing_list:
                    type: string
                    description: The mailing list email address for the committee
                    example: tsc@lists.example.org
                    format: email
                name:
                    type: string
                    description: The name of the committee
                    example: Technical Steering Committee
                    maxLength: 100
                parent_uid:
                    type: string
                    description: The UID of the parent committee -- v2 uid, not related to v1 id directly, should be empty if there is none
                    example: 90b147f2-7cdd-157a-a2f4-9d4a567123fc
                    format: uuid
                project_uid:
                    type: string
                    description: Project UID this committee belongs to -- v2 uid, not related to v1 id directly
                    example: 7cad5a8d-19d0-41a4-81a6-043453daf9ee
                    format: uuid
                public:
                    type: boolean
                    description: General committee visibility/access permissions
                    default: false
                    example: true
                repository:
                    type: string
                    description: The URL of the committee's code repository
                    example: https://github.com/example/repo
                    format: uri
                    pattern: ^https?://[^\s/$.?#][^\s]*$
                requires_review:
                    type: boolean
                    description: Whether this committee is expected to be reviewed
                    default: false
                    example: true
                scope:
                    type: array
                    items:
                        type: string
                        example: iq1
                        maxLength: 500
                    description: The scope of the committee, as a list of bullet points
                    example:
                        - Define governance for the project
                        - Review and approve major architectural changes
                    maxItems: 50
                sso_group_enabled:
                    type: boolean
                    description: Whether SSO group integration is enabled
                    default: false
                    example: true
                website:
                    type: string
                    description: The website URL of the committee
                    example: https://committee.example.org
                    format: uri
                    pattern: ^https?://[^\s/$.?#][^\s]*$
            example:
                calendar:
                    public: true
                category: Technical Steering Committee
                chat_channel: https://slack.example.org/channels/tsc
                deliverables:
                    - Quarterly technical roadmap
                    - Annual governance review
                description: Main technical oversight committee for the project
                display_name: TSC Committee Calendar
                enable_voting: true
                external_sources:
                    - entity_type: group
                      label: CNCF Meetup - San Francisco
                      provider: ocg
                      url: https://community.cncf.io/cncf-meetup-san-francisco/
                join_mode: open
                key_dates:
                    - date: 2026-04
                      label: Charter renewal
                mailing_list: tsc@lists.example.org
                name: Technical Steering Committee
                parent_uid: 90b147f2-7cdd-157a-a2f4-9d4a567123fc
                project_uid: 7cad5a8d-19d0-41a4-81a6-043453daf9ee
                public: true
                repository: https://github.com/example/repo
                requires_review: true
                scope:
                    - Define governance for the project
                    - Review and approve major architectural changes
                sso_group_enabled: true
                website: https://committee.example.org
            required:
                - name
                - category
                - project_uid
        UpdateCommitteeSettingsRequestBody:
            type: object
            properties:
                auditors:
                    type: array
                    items:
                        $ref: '#/components/schemas/CommitteeUser'
                    description: Users who can audit this committee
                    example:
                        - avatar: https://example.com/avatar.png
                          email: john@example.com
                          name: John Doe
                          username: auditor_user_id1
                business_email_required:
                    type: boolean
                    description: Whether business email is required for committee members
                    default: false
                    example: false
                chat_webhook_url:
                    type: string
                    description: 'Slack Incoming Webhook URL for sharing the weekly brief to a Slack channel. Write-only: never returned from GET. Only Slack Incoming Webhooks (https://hooks.slack.com/...) are currently accepted; other chat platforms are not supported. Send an empty string to clear a previously stored value; omit the field (or send null) to preserve the existing value.'
                    example: vlv
                    pattern: ^$|^https://hooks\.slack\.com/[^\s]*$
                    maxLength: 500
                last_reviewed_at:
                    type: string
                    description: The timestamp when the committee was last reviewed in RFC3339 format
                    example: "2025-08-04T09:00:00Z"
                    format: date-time
                last_reviewed_by:
                    type: string
                    description: The user ID who last reviewed this committee
                    example: user_id_12345
                member_visibility:
                    type: string
                    description: Dertermines the visibility level of members profiles to other members of the same committee
                    default: hidden
                    example: hidden
                    enum:
                        - hidden
                        - basic_profile
                show_meeting_attendees:
                    type: boolean
                    description: Determines the default show_meeting_attendees setting on meetings this committee is connected to
                    default: false
                    example: false
                writers:
                    type: array
                    items:
                        $ref: '#/components/schemas/CommitteeUser'
                    description: Users who can edit/modify this committee
                    example:
                        - avatar: https://example.com/avatar.png
                          email: alice@example.com
                          name: Alice Johnson
                          username: manager_user_id1
            example:
                auditors:
                    - avatar: https://example.com/avatar.png
                      email: john@example.com
                      name: John Doe
                      username: auditor_user_id1
                business_email_required: false
                chat_webhook_url: fyf
                last_reviewed_at: "2025-08-04T09:00:00Z"
                last_reviewed_by: user_id_12345
                member_visibility: hidden
                show_meeting_attendees: false
                writers:
                    - avatar: https://example.com/avatar.png
                      email: alice@example.com
                      name: Alice Johnson
                      username: manager_user_id1
            required:
                - business_email_required
        UpdateCurrentWeeklyBriefRequestBody:
            type: object
            properties:
                brief_text:
                    type: string
                    description: Edited brief body markdown text
                    example: |-
                        ## This week

                        - Shipped the thing.
                    maxLength: 20000
                revision:
                    type: integer
                    description: Optimistic-concurrency token from the brief being edited (GET /current)
                    example: 7
                    format: int64
                    minimum: 1
            example:
                brief_text: |-
                    ## This week

                    - Shipped the thing.
                revision: 7
            required:
                - brief_text
                - revision

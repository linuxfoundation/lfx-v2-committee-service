                    description: Original file name (from the uploaded file part)
                    example: Deserunt sed autem ut voluptatum.
                folder_uid:
                    type: string
                    description: Optional folder UID to place this document in
                    example: f1e2d3c4-b5a6-7890-fedc-ba9876543210
                    format: uuid
                name:
                    type: string
                    description: Display name for the document
                    example: Architecture Decision Record
                    maxLength: 500
            example:

---
name: "Committee API Build"

"on":
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  build-pr:
    name: Build and Test
    runs-on: ubuntu-latest

    # A real PostgreSQL for the schema migration tests (internal/infrastructure/postgres). The
    # tests fail on CI when TEST_DATABASE_URL is unset, so they can never be skipped silently.
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685  # 16-alpine
        env:
          # Trust auth: the container only lives for this job, and a password-less URL keeps secret
          # scanners from flagging a connection string.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: committee_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Setup go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5  # v5.5.0
        with:
          go-version-file: go.mod

      - name: Download Dependencies
        run: make deps

      - name: Build
        run: make build

      - name: Test
        run: go test ./... -v
        env:
          TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/committee_test?sslmode=disable

[[IgnoredVulns]]
id = "GO-2026-5932"
reason = "golang.org/x/crypto/openpgp is deprecated/unmaintained; the service does not use the openpgp package, and no fixed version is available"

# Stdlib fixes below land only in Go 1.26.4+, but MegaLinter's bundled golangci-lint runs with
# GOTOOLCHAIN=local on a fixed Go 1.26.3 and cannot fetch a newer patch — go.mod's `go` directive
# is capped at 1.26.3 to keep that step working. Reviewed each: none has a reachable trigger in
# this service (no idna/encoding-xml usage, no ECH config, no h2c, no in-app TLS termination, no
# <script> blocks in the html/template email templates). Revisit (drop these, bump the directive)
# once the MegaLinter image ships a newer bundled Go.
[[IgnoredVulns]]
id = "GO-2026-5026"
reason = "idna Punycode decode bug; golang.org/x/net/idna is not imported anywhere in this service. Fix ships in Go 1.26.6; go.mod capped at 1.26.3 for MegaLinter/golangci-lint compatibility (GOTOOLCHAIN=local, no auto-fetch)"

[[IgnoredVulns]]
id = "GO-2026-5037"
reason = "x509.VerifyHostname quadratic-time perf bug, client-side only, requires an already-malicious peer certificate. Fix ships in Go 1.26.4; go.mod capped at 1.26.3 for MegaLinter/golangci-lint compatibility (GOTOOLCHAIN=local, no auto-fetch)"

[[IgnoredVulns]]
id = "GO-2026-5039"
reason = "net/textproto includes unescaped input in errors (log-injection class); no direct net/textproto usage in this service. Fix ships in Go 1.26.4; go.mod capped at 1.26.3 for MegaLinter/golangci-lint compatibility (GOTOOLCHAIN=local, no auto-fetch)"

[[IgnoredVulns]]
id = "GO-2026-5856"
reason = "TLS Encrypted Client Hello pre-shared-key leak; ECH is not configured anywhere in this service. Fix ships in Go 1.26.5; go.mod capped at 1.26.3 for MegaLinter/golangci-lint compatibility (GOTOOLCHAIN=local, no auto-fetch)"

[[IgnoredVulns]]

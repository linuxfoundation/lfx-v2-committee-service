---
# ┌──────────────────────────────────────────────────────────────────────────┐
# │  DO NOT edit prompt text in this file — it is generated by Helm.        │
# │                                                                          │
# │  To update the prompt: edit weeklyBriefPrompts: in                      │
# │    charts/lfx-v2-committee-service/values.yaml, cut a new release,      │
# │    and bump the chart version in lfx-v2-argocd.                         │
# │                                                                          │
# │  Per-environment overrides in lfx-v2-argocd values/<env>/... are        │
# │  supported but should only be used when an environment genuinely needs  │
# │  a different prompt — not as the normal update path.                    │
# └──────────────────────────────────────────────────────────────────────────┘
#
# The service reads these files at pod startup. Prompt changes take effect
# after ArgoCD deploys the new chart version and the pods restart.
#
# Changelog / rollback: all changes flow through Git PR review on this repo.
# Rolling back is pinning to an earlier chart version in lfx-v2-argocd.
#
# The ConfigMap name embeds an 8-char sha256 of the prompt content so each
# prompt revision produces a distinct, immutable ConfigMap. The Deployment
# volume reference is derived from the same hash, keeping them in sync.
# Old ConfigMaps are retained (Prune=false) so a stored brief's hash can
# always be matched to the exact prompt text that produced it.
{{- $hash := printf "%s%s" .Values.weeklyBriefPrompts.systemPrompt .Values.weeklyBriefPrompts.userPromptTemplate | sha256sum | trunc 8 }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-weekly-brief-prompts-{{ $hash }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: ai-prompts
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
immutable: true
data:
  system_prompt: {{ .Values.weeklyBriefPrompts.systemPrompt | quote }}
  user_prompt_template: {{ .Values.weeklyBriefPrompts.userPromptTemplate | quote }}

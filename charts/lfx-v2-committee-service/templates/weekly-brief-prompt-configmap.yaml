---
# ┌──────────────────────────────────────────────────────────────────────────┐
# │  DO NOT edit prompt text in this file — it is generated by Helm.        │
# │                                                                          │
# │  To update the prompt for ONE environment (e.g. dev, staging, prod):    │
# │    lfx-v2-argocd/values/<env>/lfx-v2-committee-service.yaml             │
# │    Add/edit a weeklyBriefPrompts: block there. ArgoCD syncs only that   │
# │    environment — no binary redeploy needed, just a ConfigMap update.    │
# │                                                                          │
# │  To update the DEFAULT inherited by all environments that have no       │
# │    per-env override: edit weeklyBriefPrompts: in                         │
# │    charts/lfx-v2-committee-service/values.yaml and cut a new release.   │
# └──────────────────────────────────────────────────────────────────────────┘
#
# The service reads these files at pod startup. Prompt changes take effect
# after ArgoCD syncs the ConfigMap and the pods restart (no code change).
#
# Changelog / rollback: all changes flow through Git PR review on the
# lfx-v2-argocd repo. Rolling back is an ArgoCD sync to a previous revision.
#
# prompt_version MUST be bumped whenever system_prompt or user_prompt_template
# changes. The value is persisted on every generated brief so regressions can
# be traced to the exact prompt revision that produced them.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-weekly-brief-prompts
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/component: ai-prompts
data:
  prompt_version: {{ .Values.weeklyBriefPrompts.promptVersion | quote }}
  system_prompt: {{ .Values.weeklyBriefPrompts.systemPrompt | quote }}
  user_prompt_template: {{ .Values.weeklyBriefPrompts.userPromptTemplate | quote }}

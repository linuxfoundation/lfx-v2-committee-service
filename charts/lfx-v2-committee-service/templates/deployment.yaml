---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app: {{ .Chart.Name }}
        app.kubernetes.io/name: {{ .Chart.Name }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if and .Values.audit.authorizationSecretName .Values.audit.signerSecretName }}
      {{- fail "set only one of audit.authorizationSecretName and audit.signerSecretName" }}
      {{- end }}
      {{- if .Values.audit.signerSecretName }}
      securityContext:
        fsGroup: {{ .Values.audit.signerFSGroup }}
      {{- end }}
      {{- if or .Values.serviceAccount.create .Values.serviceAccount.name }}
      serviceAccountName: {{ .Values.serviceAccount.name | default .Chart.Name }}
      {{- end }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          securityContext:
            allowPrivilegeEscalation: false
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- if .Values.audit.authorizationSecretName }}
            - name: COMMITTEE_AUDIT_TOKEN_FILE
              value: /var/run/committee-audit/authorization
            {{- end }}
            {{- if .Values.audit.signerSecretName }}
            - name: COMMITTEE_AUDIT_SIGNER_KEY_FILE
              value: /var/run/committee-audit-signer/key.pem
            {{- end }}
          {{- range $name, $config := .Values.app.environment }}
            - name: {{ $name }}
              {{- /*
                  hasKey (not truthiness) so a deliberate `value: ""` renders as
                  an explicit empty string rather than collapsing to a bare
                  `- name: FOO`. Either form is accepted by Kubernetes (both
                  result in FOO=""), but explicit is clearer in the rendered
                  manifest and unambiguous to readers/linters.
              */}}
              {{- if hasKey $config "value" }}
              value: {{ $config.value | quote }}
              {{- else if $config.valueFrom }}
              valueFrom:
                {{- toYaml $config.valueFrom | nindent 16 }}
              {{- end }}
          {{- end }}
            {{- with .Values.app.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- $otelServiceName := .Values.app.otel.serviceName | toString | trim }}
            {{- if ne $otelServiceName "" }}
            - name: OTEL_SERVICE_NAME
              value: {{ $otelServiceName | quote }}
            {{- end }}
            {{- $otelServiceVersion := .Values.app.otel.serviceVersion | toString | trim }}
            {{- if ne $otelServiceVersion "" }}
            - name: OTEL_SERVICE_VERSION
              value: {{ $otelServiceVersion | quote }}
            {{- end }}
            {{- $otelEndpoint := .Values.app.otel.endpoint | toString | trim }}
            {{- if ne $otelEndpoint "" }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ $otelEndpoint | quote }}
            {{- end }}
            {{- $otelProtocol := .Values.app.otel.protocol | toString | trim }}
            {{- if ne $otelProtocol "" }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ $otelProtocol | quote }}
            {{- end }}
            {{- $otelInsecure := .Values.app.otel.insecure | toString | trim }}
            {{- if ne $otelInsecure "" }}
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: {{ $otelInsecure | quote }}
            {{- end }}
            {{- $otelTracesExporter := .Values.app.otel.tracesExporter | toString | trim }}
            {{- if ne $otelTracesExporter "" }}
            - name: OTEL_TRACES_EXPORTER
              value: {{ $otelTracesExporter | quote }}
            {{- end }}
            {{- $otelTracesSampler := .Values.app.otel.tracesSampler | toString | trim }}
            {{- if ne $otelTracesSampler "" }}
            - name: OTEL_TRACES_SAMPLER
              value: {{ $otelTracesSampler | quote }}
            {{- end }}
            {{- $otelTracesSamplerArg := .Values.app.otel.tracesSamplerArg | toString | trim }}
            {{- if ne $otelTracesSamplerArg "" }}
            - name: OTEL_TRACES_SAMPLER_ARG
              value: {{ $otelTracesSamplerArg | quote }}
            {{- end }}
            {{- $otelMetricsExporter := .Values.app.otel.metricsExporter | toString | trim }}
            {{- if ne $otelMetricsExporter "" }}
            - name: OTEL_METRICS_EXPORTER
              value: {{ $otelMetricsExporter | quote }}
            {{- end }}
            {{- $otelLogsExporter := .Values.app.otel.logsExporter | toString | trim }}
            {{- if ne $otelLogsExporter "" }}
            - name: OTEL_LOGS_EXPORTER
              value: {{ $otelLogsExporter | quote }}
            {{- end }}
            {{- $otelPropagators := .Values.app.otel.propagators | toString | trim }}
            {{- if ne $otelPropagators "" }}
            - name: OTEL_PROPAGATORS
              value: {{ $otelPropagators | quote }}
            {{- end }}
            {{- $promptDir := .Values.weeklyBriefPrompts.promptDir | toString | trim }}
            {{- $promptHash := printf "%s%s" .Values.weeklyBriefPrompts.systemPrompt .Values.weeklyBriefPrompts.userPromptTemplate | sha256sum | trunc 8 }}
            {{- if ne $promptDir "" }}
            - name: WEEKLY_BRIEF_PROMPT_DIR
              value: {{ $promptDir | quote }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.service.port }}
              name: web
          livenessProbe:
            httpGet:
              path: /livez
              port: web
            failureThreshold: 3
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: web
            failureThreshold: 1
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /readyz
              port: web
            failureThreshold: 30
            periodSeconds: 1
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or (ne $promptDir "") .Values.audit.authorizationSecretName .Values.audit.signerSecretName }}
          volumeMounts:
            {{- if .Values.audit.authorizationSecretName }}
            - name: committee-audit-authorization
              mountPath: /var/run/committee-audit
              readOnly: true
            {{- end }}
            {{- if .Values.audit.signerSecretName }}
            - name: committee-audit-signer
              mountPath: /var/run/committee-audit-signer
              readOnly: true
            {{- end }}
            {{- if ne $promptDir "" }}
            - name: weekly-brief-prompts
              mountPath: {{ $promptDir | quote }}
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or (ne $promptDir "") .Values.audit.authorizationSecretName .Values.audit.signerSecretName }}
      volumes:
        {{- if .Values.audit.authorizationSecretName }}
        - name: committee-audit-authorization
          secret:
            secretName: {{ .Values.audit.authorizationSecretName | quote }}
            defaultMode: 0444
            items:
              - key: {{ default "authorization" .Values.audit.authorizationSecretKey | quote }}
                path: authorization
        {{- end }}
        {{- if .Values.audit.signerSecretName }}
        - name: committee-audit-signer
          secret:
            secretName: {{ .Values.audit.signerSecretName | quote }}
            defaultMode: 0440
            items:
              - key: {{ default "key.pem" .Values.audit.signerSecretKey | quote }}
                path: key.pem
        {{- end }}
        {{- if ne $promptDir "" }}
        - name: weekly-brief-prompts
          configMap:
            name: {{ .Chart.Name }}-weekly-brief-prompts-{{ $promptHash }}
        {{- end }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
